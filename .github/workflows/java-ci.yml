name: Java 17 build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run automated checks
        run: sh ./test.sh

      - name: Run sample full-file report
        run: sh ./run.sh

      - name: Run rolling-window examples
        run: |
          sh ./run.sh sample/login-events.csv 3 2
          sh ./run.sh sample/login-events.csv 3 1

      - name: Check machine-readable JSON report
        run: |
          sh ./run.sh sample/login-events.csv 3 2 --json |
            python3 -c 'import json,sys; report=json.load(sys.stdin); assert report["total"] == 6 and report["windowMinutes"] == 2 and report["alerts"] == {"192.0.2.10": 3}'
